<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>筛词神器 - 管理后台</title>
<style>
* { margin:0; padding:0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f1a; color: #e0e0e0; line-height: 1.6;
}
.header {
  background: rgba(20,20,35,0.95); border-bottom: 1px solid rgba(99,102,241,0.2);
  padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
}
.header h1 { font-size: 18px; background: linear-gradient(135deg,#6366f1,#8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.login-wrap { max-width: 400px; margin: 80px auto; padding: 20px; }
.login-card {
  background: rgba(30,30,50,0.8); border-radius: 16px;
  padding: 36px 28px; border: 1px solid rgba(99,102,241,0.15);
}
.login-card h2 { text-align: center; margin-bottom: 6px; font-size: 20px; }
.login-card p { text-align: center; color: #666; margin-bottom: 24px; font-size: 13px; }
.input-group { margin-bottom: 18px; }
.input-group label { display: block; font-size: 13px; color: #888; margin-bottom: 8px; }
.input-group input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.3);
  color: #e0e0e0; font-size: 15px; outline: none; transition: all 0.2s;
}
.input-group input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
.btn-primary {
  width: 100%; padding: 12px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white;
  font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,0.35); }
.login-msg { text-align: center; margin-top: 14px; font-size: 13px; min-height: 20px; color: #ef4444; }
#adminMain { display: none; padding: 24px; max-width: 1100px; margin: 0 auto; }
.tabs { display: flex; gap: 4px; margin-bottom: 20px; background: rgba(20,20,35,0.5); border-radius: 12px; padding: 4px; width: fit-content; }
.tab-btn {
  padding: 9px 22px; border: none; border-radius: 10px; background: transparent;
  color: #888; cursor: pointer; font-size: 14px; transition: all 0.2s; font-weight: 500;
}
.tab-btn.active { background: linear-gradient(135deg,#6366f1,#8b5cf6); color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.toolbar h3 { font-size: 17px; }
.btn-sm {
  padding: 7px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all 0.2s;
}
.btn-add { background: #6366f1; color: white; }
.btn-add:hover { background: #5558e3; }
.btn-danger { background: #dc2626; color: white; }
.btn-danger:hover { background: #b91c1c; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #aaa; }
.btn-outline:hover { border-color: #6366f1; color: #6366f1; }
.table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 750px; }
th {
  background: rgba(40,40,60,0.8); padding: 11px 14px; text-align: left;
  font-weight: 600; color: #aaa; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.4px; white-space: nowrap; border-bottom: 1px solid rgba(255,255,255,0.05);
}
td { padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
tr:hover td { background: rgba(99,102,241,0.03); }
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.badge-active { background: #064e3b; color: #34d399; }
.badge-inactive { background: #450a0a; color: #fca5a5; }
.toggle-switch {
  position: relative; width: 42px; height: 24px; appearance: none; cursor: pointer;
  background: #374151; border-radius: 12px; outline: none; transition: 0.25s;
}
.toggle-switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 20px; height: 20px; border-radius: 50%; background: white; transition: 0.25s;
}
.toggle-switch:checked { background: #6366f1; }
.toggle-switch:checked::after { left: 20px; }
.tool-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tool-tag { padding: 2px 9px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.tool-tag-shaici { background: #1e293b; color: #a78bfa; border: 1px solid #6366f133; }
.tool-tag-keyword { background: #1e293b; color: #34d399; border: 1px solid #22c55e33; }
.tool-tag-all { background: rgba(99,102,241,0.1); color: #6366f1; border: 1px solid rgba(99,102,241,0.2); }
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  z-index: 200; justify-content: center; align-items: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #1a1a2e; border-radius: 16px; padding: 28px; width: 90%; max-width: 480px;
  border: 1px solid rgba(99,102,241,0.2);
}
.modal-box h3 { margin-bottom: 18px; font-size: 17px; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
.form-row input, .form-row select {
  width: 100%; padding: 10px 12px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.3);
  color: #e0e0e0; font-size: 14px; outline: none;
}
.form-row input:focus { border-color: #6366f1; }
.tool-check-group { display: flex; gap: 16px; margin-top: 6px; }
.tool-check-item { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
.tool-check-item input[type="checkbox"] { accent-color: #6366f1; width: 16px; height: 16px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
.modal-actions .btn-sm { min-width: 80px; }
.log-entry { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
.log-time { color: #666; white-space: nowrap; min-width: 150px; }
.log-info { flex: 1; }
.log-tool-badge { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: rgba(99,102,241,0.1); color: #a78bfa; }
.logout-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
  background: transparent; color: #aaa; cursor: pointer; font-size: 13px; transition: all 0.2s;
}
.logout-btn:hover { border-color: #ef4444; color: #ef4444; }
@media(max-width: 650px) {
  .header { padding: 12px 16px; } #adminMain { padding: 16px; }
  .toolbar { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>

<div class="header">
  <h1>筛词神器 · 管理后台</h1>
  <button class="logout-btn" id="logoutBtn" onclick="doLogout()" style="display:none;">退出登录</button>
</div>

<!-- Login View -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <h2>管理员登录</h2>
    <p>请输入管理员密码以访问管理后台</p>
    <form onsubmit="return false;">
      <div class="input-group"><label>管理员密码</label><input type="password" id="adminPwd" placeholder="请输入密码" autocomplete="off" onkeydown="if(event.key==='Enter')adminLogin()"></div>
      <button class="btn-primary" style="margin-top:4px;" onclick="adminLogin()">登录</button>
    </form>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<!-- Admin Main -->
<div id="adminMain">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('passwords')">口令管理</button>
    <button class="tab-btn" onclick="switchTab('logs')">访问日志</button>
  </div>

  <div class="tab-content active" id="tabPasswords">
    <div class="toolbar">
      <h3>口令列表</h3>
      <div style="display:flex;gap:8px;">
        <button class="btn-sm btn-add" onclick="showAddModal()">+ 新增口令</button>
        <button class="btn-sm btn-outline" onclick="loadPasswords()">刷新</button>
      </div>
    </div>
    <div class="table-wrap">
      <table><thead><tr>
        <th>ID</th><th>名称</th><th>口令</th><th>状态</th><th>使用次数</th><th>过期时间</th><th>工具权限</th><th>操作</th>
      </tr></thead><tbody id="pwdTableBody"></tbody></table>
    </div>
  </div>

  <div class="tab-content" id="tabLogs">
    <div class="toolbar">
      <h3>最近访问记录</h3>
      <button class="btn-sm btn-outline" onclick="loadLogs()">刷新</button>
    </div>
    <div id="logContainer"></div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <h3 id="modalTitle">新增口令</h3>
    <form onsubmit="return false;">
      <div class="form-row" id="rowName"><label>口令名称</label><input type="text" id="mName" placeholder="如：测试用户"></div>
      <div class="form-row" id="rowPwd"><label>口令值</label><input type="text" id="mPassword" placeholder="如：test003"></div>
      <div class="form-row" id="rowMax"><label>最大使用次数（留空=不限）</label><input type="number" id="mMaxUses" placeholder="不限制"></div>
      <div class="form-row" id="rowExp"><label>过期时间（留空=不过期）</label><input type="datetime-local" id="mExpires"></div>
      <div class="form-row" id="rowTools">
        <label>允许使用的工具（不选=所有工具）</label>
        <div class="tool-check-group">
          <label class="tool-check-item"><input type="checkbox" value="shaici" id="chkShaici"> 筛词神器</label>
          <label class="tool-check-item"><input type="checkbox" value="keyword" id="chkKeyword"> 关键词分类器</label>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-sm btn-outline" onclick="hideModal()">取消</button>
        <button class="btn-sm btn-add" id="modalSubmitBtn" onclick="doAddPassword()">确认添加</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Tools Modal (reuse same modal, different handler) -->
<script>
let editingPwdId = null;

// ========== Auth ==========
async function adminLogin() {
  const pwd = document.getElementById('adminPwd').value.trim();
  if (!pwd) return setLoginMsg('请输入密码');
  const r = await fetch('/api/admin/verify', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: pwd})
  });
  const d = await r.json();
  if (d.success) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('adminMain').style.display = 'block';
    document.getElementById('logoutBtn').style.display = 'inline-block';
    loadPasswords();
    loadLogs();
  } else {
    setLoginMsg(d.message || '密码错误');
  }
}
function setLoginMsg(t){ document.getElementById('loginMsg').textContent = t; }

async function doLogout() {
  await fetch('/api/admin/logout', {method:'POST'});
  location.reload();
}

// ========== Tabs ==========
function switchTab(tabName) {
  const tabs = ['passwords','logs'];
  const idx = tabName === 'logs' ? 1 : 0;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i === idx));
  document.getElementById('tabPasswords').classList.toggle('active', tabName === 'passwords');
  document.getElementById('tabLogs').classList.toggle('active', tabName === 'logs');
  if (tabName === 'logs') loadLogs();
}

// ========== Password CRUD ==========
async function loadPasswords() {
  const r = await fetch('/api/admin/passwords');
  const d = await r.json();
  const tbody = document.getElementById('pwdTableBody');
  if (!d.success) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#ef4444;">加载失败</td></tr>'; return; }
  tbody.innerHTML = d.data.map(p => {
    const toolsHtml = renderToolsCell(p.allowed_tools, p.id);
    return `<tr>
      <td>${p.id}</td>
      <td>${esc(p.name)}</td>
      <td><code style="background:rgba(0,0,0,0.3);padding:2px 8px;border-radius:4px;font-size:12px;">${esc(p.password)}</code></td>
      <td>
        <span class="badge ${p.is_active===1?'badge-active':'badge-inactive'}">${p.is_active===1?'启用':'禁用'}</span><br><br>
        <input type="checkbox" class="toggle-switch" ${p.is_active===1?'checked':''} onchange="toggleStatus(${p.id},this.checked)">
      </td>
      <td>${p.used_count || 0}${p.max_uses ? '/'+p.max_uses : ''}</td>
      <td>${p.expires_at ? new Date(p.expires_at).toLocaleString() : '永不过期'}</td>
      <td>${toolsHtml}</td>
      <td><button class="btn-sm btn-danger" onclick="deletePwd(${p.id},'${esc(p.name)}')">删除</button></td>
    </tr>`;
  }).join('');
}

function renderToolsCell(tools, pwdId) {
  if (!tools || !Array.isArray(tools) || tools.length === 0) {
    return '<span class="badge tool-tag-all">全部工具</span><br><a href="#" onclick="showEditToolsModal('+pwdId+')" style="font-size:11px;color:#6366f1;">设置权限</a>';
  }
  let html = '<div class="tool-tags">';
  if (tools.includes('shaici')) html += '<span class="tool-tag tool-tag-shaici">筛词神器</span>';
  if (tools.includes('keyword')) html += '<span class="tool-tag tool-tag-keyword">关键词分类器</span>';
  html += '</div>';
  html += '<br><a href="#" onclick="showEditToolsModal('+pwdId+')" style="font-size:11px;color:#6366f1;">修改权限</a>';
  return html;
}

async function toggleStatus(id, active) {
  await fetch(`/api/admin/passwords/${id}/status`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({is_active: active ? 1 : 0})
  });
  loadPasswords();
}

async function deletePwd(id, name) {
  if (!confirm(`确定要删除口令「${name}」吗？`)) return;
  await fetch(`/api/admin/passwords/${id}`, { method:'DELETE' });
  loadPasswords();
}

// ========== Add Password ==========
function showAddModal() {
  editingPwdId = null;
  document.getElementById('modalTitle').textContent = '新增口令';
  document.getElementById('rowName').style.display = '';
  document.getElementById('rowPwd').style.display = '';
  document.getElementById('rowMax').style.display = '';
  document.getElementById('rowExp').style.display = '';
  document.getElementById('rowTools').style.display = '';
  document.getElementById('mName').value = '';
  document.getElementById('mPassword').value = '';
  document.getElementById('mMaxUses').value = '';
  document.getElementById('mExpires').value = '';
  document.getElementById('chkShaici').checked = false;
  document.getElementById('chkKeyword').checked = false;
  document.getElementById('modalSubmitBtn').textContent = '确认添加';
  document.getElementById('modalSubmitBtn').onclick = doAddPassword;
  showModal();
}

async function doAddPassword() {
  const name = document.getElementById('mName').value.trim();
  const password = document.getElementById('mPassword').value.trim();
  if (!name || !password) return alert('名称和口令不能为空');

  const tools = [];
  if (document.getElementById('chkShaici').checked) tools.push('shaici');
  if (document.getElementById('chkKeyword').checked) tools.push('keyword');

  const payload = { name, password };
  const maxUses = document.getElementById('mMaxUses').value.trim();
  if (maxUses) payload.max_uses = parseInt(maxUses);
  const expires = document.getElementById('mExpires').value;
  if (expires) payload.expires_at = expires;

  const r = await fetch('/api/admin/passwords', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  const d = await r.json();

  if (d.success) {
    // Set tool permissions if any selected
    if (tools.length > 0) {
      await fetch(`/api/admin/passwords/${d.data.id}/tools`, {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({allowed_tools: tools})
      });
    }
    hideModal();
    loadPasswords();
  } else {
    alert(d.message || '添加失败');
  }
}

// ========== Edit Tools ==========
function showEditToolsModal(pwdId) {
  editingPwdId = pwdId;
  document.getElementById('modalTitle').textContent = '修改工具权限';
  // Hide other fields, show only tools
  document.getElementById('rowName').style.display = 'none';
  document.getElementById('rowPwd').style.display = 'none';
  document.getElementById('rowMax').style.display = 'none';
  document.getElementById('rowExp').style.display = 'none';
  document.getElementById('rowTools').style.display = '';

  // Load current permissions
  fetch('/api/admin/passwords').then(r=>r.json()).then(d=>{
    if (d.success) {
      const pwd = d.data.find(p => p.id === pwdId);
      if (pwd) {
        const tools = pwd.allowed_tools || [];
        document.getElementById('chkShaici').checked = !tools.length || tools.includes('shaici');
        document.getElementById('chkKeyword').checked = !tools.length || tools.includes('keyword');
      }
    }
  });

  document.getElementById('modalSubmitBtn').textContent = '保存修改';
  document.getElementById('modalSubmitBtn').onclick = doSaveTools;
  showModal();
}

async function doSaveTools() {
  const tools = [];
  if (document.getElementById('chkShaici').checked) tools.push('shaici');
  if (document.getElementById('chkKeyword').checked) tools.push('keyword');

  await fetch(`/api/admin/passwords/${editingPwdId}/tools`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({allowed_tools: tools.length > 0 ? tools : null})
  });
  hideModal();
  loadPasswords();
}

// ========== Logs ==========
async function loadLogs() {
  const r = await fetch('/api/admin/logs');
  const d = await r.json();
  const c = document.getElementById('logContainer');
  if (!d.success || !d.data.length) {
    c.innerHTML = '<p style="color:#666;padding:20px;text-align:center;">暂无日志</p>';
    return;
  }
  c.innerHTML = '<div class="table-wrap">' +
    d.data.map(l => `<div class="log-entry">
      <span class="log-time">${new Date(l.created_at).toLocaleString()}</span>
      <span class="log-info">IP: ${(l.ip_address||'-').substring(0,15)} | ${(l.user_agent||'').substring(0,40)}</span>
      <span class="log-tool-badge">${l.tool_name||'-'}</span>
    </div>`).join('') + '</div>';
}

// ========== Utils ==========
function showModal(){ document.getElementById('addModal').classList.add('show'); }
function hideModal(){ document.getElementById('addModal').classList.remove('show'); }
function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
