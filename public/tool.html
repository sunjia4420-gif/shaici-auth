<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>筛词神器 - 工具</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
.placeholder { padding: 40px; }
.placeholder h1 { font-size: 28px; margin-bottom: 12px; background: linear-gradient(135deg,#6366f1,#8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.placeholder p { color: #666; line-height: 1.8; }
.badge { display: inline-block; background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3); color: #a78bfa; padding: 4px 14px; border-radius: 999px; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<div class="placeholder"><h1>筛词神器</h1><p>登录验证成功！<br><br>此处将加载你的筛词工具。<br>请将你的原始工具HTML内容替换此文件。</p><div class="badge">口令保护已激活</div></div>
<script>
fetch('/api/check-auth').then(r=>r.json()).then(d=>{
  if (!d.authenticated) location.href='/login';
}).catch(()=>{});
</script>
</body>
</html>
